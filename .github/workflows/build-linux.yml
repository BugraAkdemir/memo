name: Build Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: "1.26"
  FLUTTER_CHANNEL: stable
  APP_NAME: Memo
  R2_ENDPOINT: https://ce4b56c11890013834d9c6a31568e3f9.r2.cloudflarestorage.com
  R2_BUCKET: memo

jobs:
  build:
    name: Linux x86_64
    runs-on: ubuntu-latest
    # Only the release-publish step (below) needs contents: write — every
    # other step here is read-only against the repo. Scoped to the job, not
    # the whole workflow, since pull_request-triggered runs never reach that
    # step anyway (its own `if` guards on a tag ref).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Install dependencies (SQLite + Flutter Linux GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libblkid-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: "${{ env.FLUTTER_CHANNEL }}"

      # ~/.cache/go-build (the COMPILED object cache, not the module source
      # cache below) was deliberately dropped from this path — found live:
      # the arm64 job's "Build Go backend" step completed in ~10s (CGO +
      # sqlite3 + this project's dependency tree should take noticeably
      # longer even warm, let alone genuinely cold), and the resulting
      # binary's embedded webui (internal/webserver/webui/*, go:embed)
      # was stale — several commits behind the actual checked-out source,
      # while the compiled Go *code* in the same binary was current. Never
      # fully root-caused (the actions/cache restore step for this exact
      # cache logs "File exists" tar errors against ~/go/pkg/mod and
      # reports the whole restore as a miss, which per actions/cache's own
      # documented behavior should mean a cold GOCACHE — yet the build
      # time says otherwise), but the fix doesn't require finishing that
      # investigation: go:embed content must never be served by a
      # potentially-stale cached compiled object, and the module cache
      # below (~/go/pkg/mod) is the part that actually saves meaningful
      # CI time — it's checksum-verified against go.sum by the toolchain
      # itself, so it can't silently serve wrong *code*, only wrong/absent
      # third-party source, which `go build` would simply re-fetch.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: |
            /opt/hostedtoolcache/flutter
            /home/runner/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: Flutter deps
        run: flutter pub get
        working-directory: frontend

      # No marketplace rclone action here (wei/rclone-action doesn't resolve
      # — its repo no longer exists; the same broken reference sat unnoticed
      # in upload-r2.yml since 2026-07-02, that workflow's only run failed
      # the same way and nobody had triggered it again since). Installing
      # rclone directly and calling it as a plain step sidesteps depending on
      # a marketplace action's continued existence entirely.
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Download engine binaries from R2
        run: rclone copy R2:${{ env.R2_BUCKET }}/binaries/linux/ binaries/linux/ --progress
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}

      # Must run BEFORE "Build Go backend" — internal/webserver/webapp.go's
      # //go:embed all:webapp reads whatever is physically in that
      # directory at compile time; the checked-out repo only has the
      # local-dev placeholder there (internal/webserver/webapp/index.html,
      # gitignored otherwise) until this step overwrites it with the real
      # app. Same Flutter project as the desktop build below, just a
      # different target — see internal/webserver/webapp.go's doc comment
      # for why this replaced a hand-rolled second implementation.
      - name: Build Flutter web frontend
        run: flutter build web --release
        working-directory: frontend

      - name: Copy web build into the Go embed directory
        run: |
          rm -f internal/webserver/webapp/index.html
          cp -r frontend/build/web/* internal/webserver/webapp/
          # Temporary diagnostics — a prior run's embedded binary ended up
          # byte-identical in size to the placeholder-only build despite
          # this step reporting no error, so the embed silently isn't
          # picking up what's copied here for a reason not yet understood.
          # These lines make the actual on-disk state (and go:embed's own
          # view of it) visible in the log instead of guessing again.
          echo "--- ls internal/webserver/webapp/ ---"
          ls -la internal/webserver/webapp/
          echo "--- du -sh ---"
          du -sh internal/webserver/webapp/
          echo "--- go list -f embed pattern match ---"
          go list -f '{{.EmbedFiles}}' ./internal/webserver/ || true

      - name: Build Go backend
        run: |
          CGO_ENABLED=1 go build -tags "sqlite_fts5" -o "build_output/stage/${{ env.APP_NAME }}/memo-backend" .

      - name: Build Flutter frontend
        run: flutter build linux --release
        working-directory: frontend

      - name: Stage files (engine binaries embedded, from R2)
        run: |
          S="build_output/stage/${{ env.APP_NAME }}"
          mkdir -p "$S"/{config,data/{models,memory,sessions,agent-backups,skills,whatsapp,profile}}

          cp -r frontend/build/linux/x64/release/bundle/* "$S/"
          mkdir -p "$S/binaries"
          cp -r binaries/linux "$S/binaries/linux"
          cp config/config.yaml.example "$S/config/config.yaml" 2>/dev/null || true
          cp config/config.yaml.example "$S/config/config.yaml.example" 2>/dev/null || true
          cp .env.example "$S/.env" 2>/dev/null || true
          cp data/providers.example.json "$S/data/providers.example.json" 2>/dev/null || true
          echo '[]' > "$S/data/permissions.json"
          touch "$S/data/whatsapp/.gitkeep"

      - name: Create runner script
        run: |
          S="build_output/stage/${{ env.APP_NAME }}"
          cat << 'EOF' > "$S/run_memo.sh"
          #!/bin/bash
          set -e
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          MEMO_HOME="$HOME/.memo"
          export MEMO_DATA_DIR="$MEMO_HOME/data"
          mkdir -p "$MEMO_HOME"/{config,data/{models,memory,sessions,agent-backups,skills,whatsapp,profile,bin}}

          [ ! -d "$MEMO_HOME/binaries" ] && [ -d "$DIR/binaries" ] && cp -r "$DIR/binaries" "$MEMO_HOME/binaries/"
          [ ! -f "$MEMO_HOME/config/config.yaml" ] && [ -f "$DIR/config/config.yaml" ] && cp "$DIR/config/config.yaml" "$MEMO_HOME/config/"
          [ ! -f "$MEMO_HOME/data/providers.json" ] && [ -f "$DIR/data/providers.example.json" ] && cp "$DIR/data/providers.example.json" "$MEMO_HOME/data/providers.json"
          [ ! -f "$MEMO_HOME/.env" ] && [ -f "$DIR/.env" ] && cp "$DIR/.env" "$MEMO_HOME/.env"
          [ ! -f "$MEMO_HOME/data/permissions.json" ] && echo '[]' > "$MEMO_HOME/data/permissions.json"

          cd "$MEMO_HOME"
          export LD_LIBRARY_PATH="$MEMO_HOME/data/bin:$DIR/lib:$LD_LIBRARY_PATH"

          pkill -TERM -f "memo-backend" 2>/dev/null || true; sleep 1
          "$DIR/memo-backend" > "$MEMO_HOME/backend.log" 2>&1 &
          sleep 1
          "$DIR/memo_flutter" "$@"
          curl -s -X POST "http://localhost:8090/api/shutdown" --max-time 5 >/dev/null 2>&1 || true
          EOF
          chmod +x "$S/run_memo.sh"

      - name: Package
        run: |
          mkdir -p build_output/dist
          cd build_output/stage
          zip -r "../dist/${{ env.APP_NAME }}-linux-x64.zip" "${{ env.APP_NAME }}/"
          tar czf "../dist/memo_beta.tar.gz" "${{ env.APP_NAME }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: Memo-linux-x64
          path: build_output/stage/Memo/
          retention-days: 7

      # Only on an actual tag push, not every push to main — attaches this
      # platform's zip to a GitHub release for that tag.
      # build-windows.yml/build-macos.yml each run independently and attach
      # their own platform's build to the *same* release (found/created by
      # tag name) — softprops/action-gh-release upserts rather than failing
      # if the release already exists from another platform's job finishing
      # first. prerelease: false (2026-08-08) — a tag push now also
      # republishes the stable download.bugradev.com channel (see "Upload
      # stable to R2" below), so it's a real release, not a lightweight
      # checkpoint anymore. NOTE: this means AGENTS.md's "checkpoint tag"
      # mechanism (any v* tag, cut without going through this repo's actual
      # version-bump process) now ALSO overwrites memo.tar.gz/memo.exe/
      # memo-mac.zip on R2 and shows as a full (non-prerelease) GitHub
      # release — those two concepts no longer coexist cleanly now that
      # every v* tag does the full publish. Flagged, not resolved here.
      # Human-facing release body — versinNote/<tag>.md if the memo-release
      # skill's Phase 2 produced one for this tag, empty otherwise (a
      # checkpoint tag cut outside that process has no release notes; an
      # empty body_path is a no-op for softprops/action-gh-release rather
      # than an error, so this doesn't fail the workflow). Without this the
      # release body silently defaulted to whichever commit happened to be
      # HEAD when the tag was cut — an internal CI commit message, not
      # anything end-user-facing.
      - name: Resolve release notes path
        id: notes
        run: |
          F="versinNote/${{ github.ref_name }}.md"
          if [ -f "$F" ]; then echo "path=$F" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          body_path: ${{ steps.notes.outputs.path }}
          files: build_output/dist/${{ env.APP_NAME }}-linux-x64.zip

      # A real tag push (a cut version, not a main push) republishes the
      # SAME tar.gz under the stable filename get-memo.sh already expects —
      # so a checkpoint tag doubles as "the current stable download" with no
      # separate manual upload step.
      - name: Upload stable to R2
        if: startsWith(github.ref, 'refs/tags/')
        run: rclone copyto build_output/dist/memo_beta.tar.gz R2:${{ env.R2_BUCKET }}/memo.tar.gz --progress
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACL: public-read

      # Every push straight to main (not PRs, not tags — tags get the real
      # release above) republishes a fully working, binary-embedded build
      # under a fixed filename that get-memo-beta.sh already expects, so
      # `curl -fsSL .../get-memo-beta.sh | bash` always gets the latest main.
      - name: Upload beta to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rclone copyto build_output/dist/memo_beta.tar.gz R2:${{ env.R2_BUCKET }}/memo_beta.tar.gz --progress
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACL: public-read

  build-arm64:
    name: Linux arm64
    # Native build, no cross-compiling — GitHub's free hosted arm64 Ubuntu
    # runner (public repos only). Deliberately a separate job rather than a
    # matrix over the job above: keeps this addition fully isolated from
    # the proven x86_64 pipeline (a bug here can't break that one), at the
    # cost of some duplication.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Install dependencies (SQLite + Flutter Linux GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libblkid-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev libjsoncpp-dev

      # subosito/flutter-action has no arm64 support: it resolves a Flutter
      # SDK archive from Google's releases_linux.json manifest, which only
      # ever lists x64 archives (verified directly — 728 stable releases,
      # zero arch field, every archive path is .../linux/flutter_linux_*,
      # no arm64 variant). Upstream tracks this as issue #345 (open) / PR
      # #403 (open, unmerged) — its own fix is exactly this: fall back to
      # `git clone` and let Flutter's own tooling fetch the right engine
      # artifacts for whatever host arch it's actually running on, which is
      # how the framework has always worked underneath the SDK-archive
      # convenience path. Cache restore has to happen BEFORE the clone step
      # (not after, like the block below might suggest at a glance) so a
      # cache hit can make the clone a no-op instead of failing on an
      # already-populated directory.
      - uses: actions/cache@v4
        id: flutter-cache
        with:
          path: |
            ~/flutter
            ~/.pub-cache
          key: flutter-${{ runner.os }}-arm64-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-arm64-

      - name: Install Flutter (git clone — flutter-action has no arm64 archive)
        run: |
          if [ ! -x "$HOME/flutter/bin/flutter" ]; then
            rm -rf "$HOME/flutter"
            git clone -b "${{ env.FLUTTER_CHANNEL }}" --depth 1 https://github.com/flutter/flutter.git "$HOME/flutter"
          fi
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # ~/.cache/go-build dropped — see the identical comment on the
      # x86_64 job's cache step above for why (this is that same bug,
      # found live on this exact job).
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
          key: go-${{ runner.os }}-arm64-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-arm64-

      - name: flutter doctor
        run: flutter doctor -v

      - name: Flutter deps
        run: flutter pub get
        working-directory: frontend

      # R2 only stores an arch-suffixed "cpu-arm64" folder (Linux x86_64's
      # own binaries/linux/cpu/ is a different, incompatible build) — same
      # rename-on-install trick get_memo_arm.sh already does, done here at
      # package time instead so the shipped zip needs zero install-time
      # special-casing.
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Download engine binaries from R2
        run: rclone copy R2:${{ env.R2_BUCKET }}/binaries/linux/cpu-arm64/ binaries/linux/cpu/ --progress
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}

      # Must run BEFORE "Build Go backend" — see the identical comment on
      # the x86_64 job's equivalent step above. Web output is
      # architecture-independent (JS/wasm), so this arm64 runner produces
      # byte-for-byte the same webapp/ content the x86_64 job does.
      - name: Build Flutter web frontend
        run: flutter build web --release
        working-directory: frontend

      - name: Copy web build into the Go embed directory
        run: |
          rm -f internal/webserver/webapp/index.html
          cp -r frontend/build/web/* internal/webserver/webapp/
          # Temporary diagnostics — a prior run's embedded binary ended up
          # byte-identical in size to the placeholder-only build despite
          # this step reporting no error, so the embed silently isn't
          # picking up what's copied here for a reason not yet understood.
          # These lines make the actual on-disk state (and go:embed's own
          # view of it) visible in the log instead of guessing again.
          echo "--- ls internal/webserver/webapp/ ---"
          ls -la internal/webserver/webapp/
          echo "--- du -sh ---"
          du -sh internal/webserver/webapp/
          echo "--- go list -f embed pattern match ---"
          go list -f '{{.EmbedFiles}}' ./internal/webserver/ || true

      - name: Build Go backend
        run: |
          CGO_ENABLED=1 go build -tags "sqlite_fts5" -o "build_output/stage/${{ env.APP_NAME }}/memo-backend" .

      - name: Build Flutter frontend
        run: flutter build linux --release
        working-directory: frontend

      - name: Stage files (engine binaries embedded, from R2)
        run: |
          S="build_output/stage/${{ env.APP_NAME }}"
          mkdir -p "$S"/{config,data/{models,memory,sessions,agent-backups,skills,whatsapp,profile}}

          # Flutter's own output dir is arch-named (x64/arm64) — arm64 here,
          # unlike the x86_64 job above which is still hardcoded to x64.
          cp -r frontend/build/linux/arm64/release/bundle/* "$S/"
          mkdir -p "$S/binaries/linux"
          cp -r binaries/linux/cpu "$S/binaries/linux/cpu"
          cp config/config.yaml.example "$S/config/config.yaml" 2>/dev/null || true
          cp config/config.yaml.example "$S/config/config.yaml.example" 2>/dev/null || true
          cp .env.example "$S/.env" 2>/dev/null || true
          cp data/providers.example.json "$S/data/providers.example.json" 2>/dev/null || true
          echo '[]' > "$S/data/permissions.json"
          touch "$S/data/whatsapp/.gitkeep"

      - name: Create runner script
        run: |
          S="build_output/stage/${{ env.APP_NAME }}"
          cat << 'EOF' > "$S/run_memo.sh"
          #!/bin/bash
          set -e
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          MEMO_HOME="$HOME/.memo"
          export MEMO_DATA_DIR="$MEMO_HOME/data"
          mkdir -p "$MEMO_HOME"/{config,data/{models,memory,sessions,agent-backups,skills,whatsapp,profile,bin}}

          [ ! -d "$MEMO_HOME/binaries" ] && [ -d "$DIR/binaries" ] && cp -r "$DIR/binaries" "$MEMO_HOME/binaries/"
          [ ! -f "$MEMO_HOME/config/config.yaml" ] && [ -f "$DIR/config/config.yaml" ] && cp "$DIR/config/config.yaml" "$MEMO_HOME/config/"
          [ ! -f "$MEMO_HOME/data/providers.json" ] && [ -f "$DIR/data/providers.example.json" ] && cp "$DIR/data/providers.example.json" "$MEMO_HOME/data/providers.json"
          [ ! -f "$MEMO_HOME/.env" ] && [ -f "$DIR/.env" ] && cp "$DIR/.env" "$MEMO_HOME/.env"
          [ ! -f "$MEMO_HOME/data/permissions.json" ] && echo '[]' > "$MEMO_HOME/data/permissions.json"

          cd "$MEMO_HOME"
          export LD_LIBRARY_PATH="$MEMO_HOME/data/bin:$DIR/lib:$LD_LIBRARY_PATH"

          pkill -TERM -f "memo-backend" 2>/dev/null || true; sleep 1
          "$DIR/memo-backend" > "$MEMO_HOME/backend.log" 2>&1 &
          sleep 1
          "$DIR/memo_flutter" "$@"
          curl -s -X POST "http://localhost:8090/api/shutdown" --max-time 5 >/dev/null 2>&1 || true
          EOF
          chmod +x "$S/run_memo.sh"

      - name: Package
        run: |
          mkdir -p build_output/dist
          cd build_output/stage
          zip -r "../dist/${{ env.APP_NAME }}-linux-arm64.zip" "${{ env.APP_NAME }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: Memo-linux-arm64
          path: build_output/stage/Memo/
          retention-days: 7

      # See the x86_64 job's identical step for the full explanation.
      - name: Resolve release notes path
        id: notes
        run: |
          F="versinNote/${{ github.ref_name }}.md"
          if [ -f "$F" ]; then echo "path=$F" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          body_path: ${{ steps.notes.outputs.path }}
          files: build_output/dist/${{ env.APP_NAME }}-linux-arm64.zip

      # A real tag push republishes the same zip under the stable filename
      # get_memo_arm.sh already expects (see build-linux.yml x64 job's
      # identical step above).
      - name: Upload stable to R2
        if: startsWith(github.ref, 'refs/tags/')
        run: rclone copyto build_output/dist/${{ env.APP_NAME }}-linux-arm64.zip R2:${{ env.R2_BUCKET }}/memo_arm.zip --progress
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACL: public-read

      # Same fixed-name beta channel as the x86_64 job above, ARM's own
      # dedicated filename (get_memo_arm.sh's own installer/updater still
      # points at the stable memo_arm.zip — this is a separate, always-latest
      # beta channel, no existing installer script consumes it yet).
      - name: Upload beta to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rclone copyto build_output/dist/${{ env.APP_NAME }}-linux-arm64.zip R2:${{ env.R2_BUCKET }}/memo_arm_beta.zip --progress
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACL: public-read
