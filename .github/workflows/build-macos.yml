name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: "1.26"
  FLUTTER_CHANNEL: stable
  APP_NAME: Memo
  R2_ENDPOINT: https://ce4b56c11890013834d9c6a31568e3f9.r2.cloudflarestorage.com
  R2_BUCKET: memo

jobs:
  build:
    name: macOS (arm64 + x86_64)
    runs-on: macos-latest
    # See build-linux.yml's identical comment — scoped to this job since
    # only the tag-gated release-publish step below needs it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"

      - uses: subosito/flutter-action@v2
        with:
          channel: "${{ env.FLUTTER_CHANNEL }}"

      # ~/Library/Caches/go-build (compiled-object cache) deliberately
      # dropped — see build-linux.yml's cache step for the full story (the
      # same risk applies here even though it was only actually observed
      # on Linux; an earlier pass here mistakenly claimed this job "never
      # opted into" that cache, which was wrong — it's the same block,
      # just under macOS's own cache-dir naming, missed by a Linux-path-
      # specific grep at the time).
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: |
            /opt/hostedtoolcache/flutter
            /Users/runner/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: Flutter deps
        run: flutter pub get
        working-directory: frontend

      # Must run BEFORE "Build Go backend" — see build-linux.yml's
      # identical comment for why (go:embed reads webapp/ at compile time).
      - name: Build Flutter web frontend
        run: flutter build web --release
        working-directory: frontend

      - name: Copy web build into the Go embed directory
        run: |
          rm -f internal/webserver/webapp/index.html
          cp -r frontend/build/web/* internal/webserver/webapp/

      - name: Build Go backend
        run: |
          ARCH=$(uname -m)
          GOARCH=$ARCH CGO_ENABLED=1 go build -tags "sqlite_fts5" -o "build_output/stage/${{ env.APP_NAME }}/memo-backend" .

      - name: Build Flutter frontend
        run: flutter build macos --release
        env:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        working-directory: frontend

      - name: Stage files (engine binaries embedded, already in git)
        run: |
          S="build_output/stage/${{ env.APP_NAME }}"
          mkdir -p "$S"/{config,data/{models,memory,sessions,agent-backups,skills,whatsapp,profile}}

          APP_BUNDLE=$(find frontend/build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n1)
          if [ -n "$APP_BUNDLE" ]; then
            cp -R "$APP_BUNDLE" "$S/${{ env.APP_NAME }}.app"
          fi
          # binaries/darwin/ is small enough (~17MB) to be committed straight
          # to git (unlike linux/windows, which are R2-only) — no download
          # step needed, it's already in the checkout.
          mkdir -p "$S/binaries"
          cp -r binaries/darwin "$S/binaries/darwin"
          cp config/config.yaml.example "$S/config/config.yaml" 2>/dev/null || true
          cp config/config.yaml.example "$S/config/config.yaml.example" 2>/dev/null || true
          cp .env.example "$S/.env" 2>/dev/null || true
          cp data/providers.example.json "$S/data/providers.example.json" 2>/dev/null || true
          echo '[]' > "$S/data/permissions.json"
          touch "$S/data/whatsapp/.gitkeep"

      - name: Create runner script
        run: |
          S="build_output/stage/${{ env.APP_NAME }}"
          cat << 'EOF' > "$S/run_memo.command"
          #!/bin/bash
          set -e
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          MEMO_HOME="$HOME/.memo"
          export MEMO_DATA_DIR="$MEMO_HOME/data"
          mkdir -p "$MEMO_HOME"/{config,data/{models,memory,sessions,agent-backups,skills,whatsapp,profile,bin}}

          if [ ! -d "$MEMO_HOME/binaries" ] && [ -d "$DIR/binaries" ]; then
              echo "📦 İlk çalıştırma: engine binary'leri kopyalanıyor..."
              cp -r "$DIR/binaries" "$MEMO_HOME/binaries/"

              ARCH=$(uname -m)
              BIN_DIR="$MEMO_HOME/binaries/darwin/cpu"
              if [ "$ARCH" = "arm64" ] && [ -f "$BIN_DIR/llama-server-arm64" ]; then
                  cp "$BIN_DIR/llama-server-arm64" "$BIN_DIR/llama-server"
                  cp "$BIN_DIR/vec0-arm64.dylib" "$BIN_DIR/vec0.dylib"
              elif [ "$ARCH" = "x86_64" ] && [ -f "$BIN_DIR/llama-server-x64" ]; then
                  cp "$BIN_DIR/llama-server-x64" "$BIN_DIR/llama-server"
                  cp "$BIN_DIR/vec0-x86_64.dylib" "$BIN_DIR/vec0.dylib"
              fi
              chmod +x "$BIN_DIR/llama-server" 2>/dev/null || true
          fi
          [ ! -f "$MEMO_HOME/config/config.yaml" ] && [ -f "$DIR/config/config.yaml" ] && cp "$DIR/config/config.yaml" "$MEMO_HOME/config/"
          [ ! -f "$MEMO_HOME/data/providers.json" ] && [ -f "$DIR/data/providers.example.json" ] && cp "$DIR/data/providers.example.json" "$MEMO_HOME/data/providers.json"
          [ ! -f "$MEMO_HOME/.env" ] && [ -f "$DIR/.env" ] && cp "$DIR/.env" "$MEMO_HOME/.env"
          [ ! -f "$MEMO_HOME/data/permissions.json" ] && echo '[]' > "$MEMO_HOME/data/permissions.json"

          cd "$MEMO_HOME"
          export DYLD_LIBRARY_PATH="$MEMO_HOME/data/bin:$MEMO_HOME.app/Contents/Frameworks:$DYLD_LIBRARY_PATH"

          # Check if a backend is already running (e.g. started via the
          # `memo` terminal CLI) - attach to it instead of killing it and
          # starting a second one, which caused a port-bind conflict and
          # crashed both.
          BACKEND_ALREADY_RUNNING=false
          if curl -s -o /dev/null --max-time 2 "http://localhost:8090/api/status"; then
              BACKEND_ALREADY_RUNNING=true
              echo "Zaten çalışan bir Memo backend'i bulundu, ona bağlanılıyor."
          fi

          if [ "$BACKEND_ALREADY_RUNNING" = false ]; then
              pkill -9 -f "memo-backend" 2>/dev/null || true
              pkill -9 -f "llama-server" 2>/dev/null || true
              sleep 0.5
              "$DIR/memo-backend" > "$MEMO_HOME/backend.log" 2>&1 &
              sleep 1
          fi
          "$DIR/${{ env.APP_NAME }}.app/Contents/MacOS/${{ env.APP_NAME }}" "$@"
          if [ "$BACKEND_ALREADY_RUNNING" = false ]; then
              curl -s -X POST "http://localhost:8090/api/shutdown" --max-time 5 >/dev/null 2>&1 || true
          fi
          EOF
          chmod +x "$S/run_memo.command"
          xattr -dr com.apple.quarantine "$S/${{ env.APP_NAME }}.app" 2>/dev/null || true

      - name: Package
        run: |
          mkdir -p build_output/dist
          cd build_output/stage
          zip -r "../dist/${{ env.APP_NAME }}-macos.zip" "${{ env.APP_NAME }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: Memo-macos
          path: build_output/stage/Memo/
          retention-days: 7

      # See build-linux.yml's identical step for the full explanation.
      - name: Resolve release notes path
        id: notes
        run: |
          F="versinNote/${{ github.ref_name }}.md"
          if [ -f "$F" ]; then echo "path=$F" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          body_path: ${{ steps.notes.outputs.path }}
          files: build_output/dist/${{ env.APP_NAME }}-macos.zip

      # No marketplace rclone action (see build-linux.yml's identical note —
      # wei/rclone-action's repo no longer exists). Fixed filename
      # get-memo-beta.sh already expects for Darwin.
      - name: Install rclone
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      # A real tag push republishes the same zip under the stable filename
      # get-memo.sh already expects (see build-linux.yml's identical step).
      - name: Upload stable to R2
        if: startsWith(github.ref, 'refs/tags/')
        run: rclone copyto build_output/dist/${{ env.APP_NAME }}-macos.zip R2:${{ env.R2_BUCKET }}/memo-mac.zip --progress
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACL: public-read

      - name: Upload beta to R2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rclone copyto build_output/dist/${{ env.APP_NAME }}-macos.zip R2:${{ env.R2_BUCKET }}/memo-mac_beta.zip --progress
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACL: public-read
