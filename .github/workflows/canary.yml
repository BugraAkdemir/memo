# Canaries for external dependencies (gosearch's Bing/DuckDuckGo HTML scrape
# + page-fetch extractor, WhatsApp Noise handshake via whatsmeow). Two
# trigger modes:
#   - push to main: every commit (catch breakage soon after it ships)
#   - weekly cron: still runs when a week has no commits (catch silent
#     upstream breakage with zero local activity)
# Build tag "canary" keeps these out of the normal CI `go test ./...` suite.
name: Canary

on:
  push:
    branches: [main]
  schedule:
    # Monday 06:00 UTC — safety net when the repo is quiet
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  GO_VERSION: "1.26"

jobs:
  canary:
    name: External dependency canaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-canary-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-canary-${{ runner.os }}-

      - name: Web search canary (Bing/DuckDuckGo + fetch)
        run: go test -tags "sqlite_fts5 canary" -count=1 -run TestCanary ./internal/websearch/...

      - name: WhatsApp handshake canary
        run: go test -tags "sqlite_fts5 canary" -count=1 -run TestCanary ./internal/whatsapp/...
