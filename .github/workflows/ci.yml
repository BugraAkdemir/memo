name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.26"
  FLUTTER_CHANNEL: stable

jobs:
  test:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Build check
        run: go build -tags "sqlite_fts5" -o /dev/null .

      - name: Vet
        run: go vet -tags "sqlite_fts5" ./...

      - name: Test with race detector
        run: go test -tags "sqlite_fts5" -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.out
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  flutter:
    name: Analyze & Test (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "${{ env.FLUTTER_CHANNEL }}"

      - uses: actions/cache@v4
        with:
          path: |
            /opt/hostedtoolcache/flutter
            /home/runner/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: Get dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        working-directory: frontend

      - name: Test
        run: flutter test --coverage
        working-directory: frontend

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          directory: frontend/coverage
          flags: flutter
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  l10n-guard:
    name: L10n Guard (Rule #8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # AGENTS.md Rule #8: every user-visible string must go through L10n.t()
      # with BOTH tr+en entries. Same heuristic as AGENTS.md's Verification
      # Commands — flags Text(/Tooltip(/SnackBar(/AlertDialog( calls whose
      # argument starts with a quoted literal, in Dart files touched by this
      # push/PR. l10n.dart itself is excluded (it owns the string maps).
      - name: Check changed .dart files for hardcoded UI literals
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --no-tags 2>/dev/null || true
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="${{ github.sha }}~1"
            fi
          fi
          echo "Diffing ${BASE}..${{ github.sha }}"

          mapfile -t FILES < <(git diff --name-only "${BASE}".."${{ github.sha }}" -- '*.dart' | grep -v '^frontend/lib/core/l10n\.dart$' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No Dart files changed — nothing to check."
            exit 0
          fi

          EXISTING=()
          for f in "${FILES[@]}"; do [ -f "$f" ] && EXISTING+=("$f"); done
          if [ "${#EXISTING[@]}" -eq 0 ]; then
            echo "All changed Dart files were deletions — nothing to check."
            exit 0
          fi

          VIOLATIONS=$(grep -nE "(Text|Tooltip|SnackBar|AlertDialog)\(\s*['\"][A-Za-zÇĞİÖŞÜçğıöşü]" "${EXISTING[@]}" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "$VIOLATIONS"
            echo "::error title=L10n Guard::Hardcoded user-facing string(s) found. Route through L10n.t('key') and add BOTH Turkish and English entries in frontend/lib/core/l10n.dart (AGENTS.md Rule #8)."
            exit 1
          fi
          echo "OK — no hardcoded UI literals in changed Dart files."
