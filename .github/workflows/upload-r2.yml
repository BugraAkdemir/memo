name: Upload to R2 (Beta)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v3.1.1-beta)'
        required: true
        default: 'v3.1.1-beta'

env:
  GO_VERSION: "1.26"
  FLUTTER_CHANNEL: stable
  APP_NAME: Memo
  R2_ENDPOINT: https://ce4b56c11890013834d9c6a31568e3f9.r2.cloudflarestorage.com
  R2_BUCKET: memo

jobs:
  # ─── Linux ──────────────────────────────────────────────────────
  build-linux:
    name: Build & Upload Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: subosito/flutter-action@v2
        with: { channel: "${{ env.FLUTTER_CHANNEL }}" }

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libblkid-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev libjsoncpp-dev

      - name: Build Go backend
        run: CGO_ENABLED=1 go build -tags "sqlite_fts5" -o "build_output/stage/${{ env.APP_NAME }}/memo-backend" .

      - name: Build Flutter frontend
        working-directory: frontend
        run: flutter build linux --release

      - name: Stage
        run: |
          S="build_output/stage/${{ env.APP_NAME }}"
          mkdir -p "$S"/{config,data/{models,memory,sessions,agent-backups,skills,whatsapp,profile}}
          cp -r frontend/build/linux/x64/release/bundle/* "$S/"
          cp config/config.yaml.example "$S/config/config.yaml" 2>/dev/null || true
          cp .env.example "$S/.env" 2>/dev/null || true
          echo '[]' > "$S/data/permissions.json"
          touch "$S/data/whatsapp/.gitkeep"

      - name: Package
        run: |
          mkdir -p build_output/dist
          V=${{ github.event.inputs.version }}
          cd build_output/stage && zip -r "../dist/${{ env.APP_NAME }}-linux-x64-${V#v}.zip" "${{ env.APP_NAME }}/"

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Upload to R2
        run: rclone copy build_output/dist/ R2:${{ env.R2_BUCKET }}/ --progress
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACL: public-read

  # ─── Windows ────────────────────────────────────────────────────
  build-windows:
    name: Build & Upload Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: subosito/flutter-action@v2
        with: { channel: "${{ env.FLUTTER_CHANNEL }}" }

      - name: Build Go backend
        run: |
          set CGO_ENABLED=1
          go build -tags "sqlite_fts5" -o "build_output\stage\${{ env.APP_NAME }}\memo-backend.exe" .
        shell: cmd

      - name: Build Flutter frontend
        working-directory: frontend
        run: flutter build windows --release

      - name: Stage
        shell: pwsh
        run: |
          $S = "build_output\stage\${{ env.APP_NAME }}"
          New-Item -ItemType Directory -Force -Path "$S\config"
          New-Item -ItemType Directory -Force -Path "$S\data\models"
          New-Item -ItemType Directory -Force -Path "$S\data\memory"
          New-Item -ItemType Directory -Force -Path "$S\data\sessions"
          New-Item -ItemType Directory -Force -Path "$S\data\agent-backups"
          New-Item -ItemType Directory -Force -Path "$S\data\skills"
          New-Item -ItemType Directory -Force -Path "$S\data\whatsapp"
          New-Item -ItemType Directory -Force -Path "$S\data\profile"

          $flutterOut = Get-ChildItem -Path "frontend\build\windows" -Recurse -Directory -Filter "Release" |
                        Where-Object { Test-Path "$($_.FullName)\memo_flutter.exe" } |
                        Select-Object -First 1 -ExpandProperty FullName
          robocopy "$flutterOut" "$S" /E /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with code $LASTEXITCODE" }
          $LASTEXITCODE = 0

          Copy-Item "config\config.yaml.example" "$S\config\config.yaml" -ErrorAction SilentlyContinue
          Copy-Item ".env.example" "$S\.env" -ErrorAction SilentlyContinue
          Copy-Item "data\providers.example.json" "$S\data\providers.example.json" -ErrorAction SilentlyContinue
          "[]" | Out-File -Encoding ASCII "$S\data\permissions.json"
          "" | Out-File -Encoding ASCII "$S\data\whatsapp\.gitkeep"

          $runner = @'
          @echo off
          setlocal enabledelayedexpansion
          cd /d "%~dp0"
          set "APP_DIR=%~dp0"
          set "MEMO_HOME=%USERPROFILE%\.memo"

          mkdir "%MEMO_HOME%\data\bin" 2>nul
          mkdir "%MEMO_HOME%\data\models" 2>nul
          mkdir "%MEMO_HOME%\data\memory" 2>nul
          mkdir "%MEMO_HOME%\data\sessions" 2>nul
          mkdir "%MEMO_HOME%\data\agent-backups" 2>nul
          mkdir "%MEMO_HOME%\data\skills" 2>nul
          mkdir "%MEMO_HOME%\data\whatsapp" 2>nul
          mkdir "%MEMO_HOME%\data\profile" 2>nul
          mkdir "%MEMO_HOME%\config" 2>nul

          if not exist "%MEMO_HOME%\binaries" (
              if exist "%APP_DIR%binaries" (
                  mkdir "%MEMO_HOME%\binaries"
                  xcopy /E /I /Y "%APP_DIR%binaries" "%MEMO_HOME%\binaries\" >nul
              )
          )
          if not exist "%MEMO_HOME%\config\config.yaml" (
              if exist "%APP_DIR%config" (
                  xcopy /E /I /Y "%APP_DIR%config" "%MEMO_HOME%\config\" >nul
              )
          )
          if not exist "%MEMO_HOME%\.env" (
              if exist "%APP_DIR%.env" copy "%APP_DIR%.env" "%MEMO_HOME%\.env" >nul
          )
          if not exist "%MEMO_HOME%\data\providers.json" (
              if exist "%APP_DIR%data\providers.example.json" copy "%APP_DIR%data\providers.example.json" "%MEMO_HOME%\data\providers.json" >nul
          )
          if not exist "%MEMO_HOME%\data\permissions.json" echo [] > "%MEMO_HOME%\data\permissions.json"

          set "PATH=%APP_DIR%binaries\windows;%APP_DIR%binaries\windows\cpu;%APP_DIR%binaries\windows\nvidia;%APP_DIR%binaries\windows\amd;%MEMO_HOME%\data\bin;%PATH%"

          start "" /B "%APP_DIR%memo-backend.exe"
          start "" /WAIT "%APP_DIR%memo_flutter.exe"
          taskkill /F /IM memo-backend.exe >nul 2>&1
          taskkill /F /IM llama-server.exe >nul 2>&1
          endlocal
          '@
          $runner | Out-File -Encoding ASCII "$S\run_memo.bat"

          $ps1 = @'
          $scriptDir = Split-Path -Parent $MyInvocation.MyCommand.Path
          Set-Location $scriptDir

          $env:MEMO_HOME = "$env:USERPROFILE\.memo"

          New-Item -ItemType Directory -Force -Path "$env:MEMO_HOME\data\bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:MEMO_HOME\data\models" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:MEMO_HOME\data\memory" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:MEMO_HOME\data\sessions" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:MEMO_HOME\data\agent-backups" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:MEMO_HOME\data\skills" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:MEMO_HOME\data\whatsapp" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:MEMO_HOME\data\profile" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:MEMO_HOME\config" | Out-Null

          if (-not (Test-Path "$env:MEMO_HOME\binaries") -and (Test-Path "$scriptDir\binaries")) {
              Copy-Item -Recurse -Force "$scriptDir\binaries" "$env:MEMO_HOME\binaries\"
          }
          if (-not (Test-Path "$env:MEMO_HOME\config\config.yaml") -and (Test-Path "$scriptDir\config")) {
              Copy-Item -Recurse -Force "$scriptDir\config" "$env:MEMO_HOME\config\"
          }
          if (-not (Test-Path "$env:MEMO_HOME\.env") -and (Test-Path "$scriptDir\.env")) {
              Copy-Item "$scriptDir\.env" "$env:MEMO_HOME\.env"
          }
          if (-not (Test-Path "$env:MEMO_HOME\data\providers.json") -and (Test-Path "$scriptDir\data\providers.example.json")) {
              Copy-Item "$scriptDir\data\providers.example.json" "$env:MEMO_HOME\data\providers.json"
          }
          if (-not (Test-Path "$env:MEMO_HOME\data\permissions.json")) {
              "[]" | Out-File -Encoding ASCII "$env:MEMO_HOME\data\permissions.json"
          }

          $env:PATH = "$scriptDir\binaries\windows;$scriptDir\binaries\windows\cpu;$scriptDir\binaries\windows\nvidia;$scriptDir\binaries\windows\amd;$env:MEMO_HOME\data\bin;$env:PATH"

          try { Invoke-RestMethod -Uri 'http://localhost:8090/api/shutdown' -Method POST -TimeoutSec 3 } catch {}
          Start-Sleep -Seconds 1
          Get-Process -Name 'memo-backend' -ErrorAction SilentlyContinue | Stop-Process -Force

          $backend = Start-Process -FilePath "$scriptDir\memo-backend.exe" -WorkingDirectory $env:MEMO_HOME -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 2

          $flutter = Start-Process -FilePath "$scriptDir\memo_flutter.exe" -WorkingDirectory $scriptDir -PassThru
          $flutter.WaitForExit()

          try { Invoke-RestMethod -Uri 'http://localhost:8090/api/shutdown' -Method POST -TimeoutSec 5 } catch {}
          Start-Sleep -Seconds 2
          if (-not $backend.HasExited) { Stop-Process -Id $backend.Id -Force }
          Get-Process -Name 'llama-server' -ErrorAction SilentlyContinue | Stop-Process -Force
          '@
          $ps1 | Out-File -Encoding ASCII "$S\launch.ps1"

          $launcher = @'
          Set oShell = CreateObject("WScript.Shell")
          Set oFSO = CreateObject("Scripting.FileSystemObject")
          sPath = oFSO.GetParentFolderName(WScript.ScriptFullName)
          oShell.Run "powershell -ExecutionPolicy Bypass -WindowStyle Hidden -File " & """" & sPath & "\launch.ps1" & """", 0, False
          '@
          $launcher | Out-File -Encoding ASCII "$S\launch.vbs"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_output\dist
          $V = "${{ github.event.inputs.version }}" -replace '^v', ''
          Compress-Archive -Path "build_output\stage\${{ env.APP_NAME }}\*" -DestinationPath "build_output\dist\${{ env.APP_NAME }}-windows-x64-$V.zip" -Force

      - name: Install rclone
        run: choco install rclone -y --no-progress
        shell: pwsh

      - name: Upload to R2
        run: rclone copy build_output/dist/ R2:${{ env.R2_BUCKET }}/ --progress
        shell: pwsh
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACL: public-read

  # ─── macOS ──────────────────────────────────────────────────────
  build-macos:
    name: Build & Upload macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: subosito/flutter-action@v2
        with: { channel: "${{ env.FLUTTER_CHANNEL }}" }

      - name: Build Go backend
        run: CGO_ENABLED=1 go build -tags "sqlite_fts5" -o "build_output/stage/${{ env.APP_NAME }}/memo-backend" .

      - name: Build Flutter frontend
        working-directory: frontend
        run: flutter build macos --release
        env:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"

      - name: Stage
        run: |
          S="build_output/stage/${{ env.APP_NAME }}"
          mkdir -p "$S"/{config,data/{models,memory,sessions,agent-backups,skills,whatsapp,profile}}
          APP_BUNDLE=$(find frontend/build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n1)
          if [ -n "$APP_BUNDLE" ]; then cp -R "$APP_BUNDLE" "$S/${{ env.APP_NAME }}.app"; fi
          cp config/config.yaml.example "$S/config/config.yaml" 2>/dev/null || true
          cp .env.example "$S/.env" 2>/dev/null || true
          echo '[]' > "$S/data/permissions.json"
          touch "$S/data/whatsapp/.gitkeep"

      - name: Package
        run: |
          mkdir -p build_output/dist
          V=${{ github.event.inputs.version }}
          cd build_output/stage && zip -r "../dist/${{ env.APP_NAME }}-macos-${V#v}.zip" "${{ env.APP_NAME }}/"

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Upload to R2
        run: rclone copy build_output/dist/ R2:${{ env.R2_BUCKET }}/ --progress
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACL: public-read
