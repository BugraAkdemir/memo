api:
    base_url: http://localhost:1234/v1
    embedding_model: nomic-embed-text-v1.5
    timeout_seconds: 120
identity:
    user_name: User
    assistant_name: Memo
    style: casual
    system_role: |-
        You are Memo, a highly capable AI assistant. You are speaking with User.

        Core Directives:
        - You have persistent memory. You remember past conversations and use that context naturally.
        - You are model-agnostic — regardless of the underlying LLM, you maintain your identity as Memo.
        - Be helpful, accurate, and thoughtful in every response.
        - When you recall something from a past conversation, integrate it naturally without saying "I recall" or "As we discussed".
        - Adapt to the user's language. If they write in Turkish, respond in Turkish. If English, respond in English.
    incognito_prompt: ""
memory:
    persist_dir: ./data/memory
    top_k: 5
    min_similarity: 0.1
remote_access:
    enabled: true
    port: 8088
llama:
    binary_path: data/bin/llama-server
    port: 8081
    embedding_port: 8082
    ctx_size: 4096
    models_dir: ./data/models
sync:
    enabled: true
    client_id: ""
    client_secret: ""
    passphrase: ""
    token_path: ./data/sync_token.json
    interval_messages: 50
