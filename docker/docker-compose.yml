# Memo — backend-only container for CasaOS / any Docker host.
#
# Install in CasaOS via App Store -> "Install a customized app" -> paste this
# file as-is — the image below is built and published automatically by
# .github/workflows/build-docker.yml on every push to main (:beta) and every
# release tag (:latest), no manual `docker build`/`docker push` needed. See
# docker/README.md if you want to build your own image instead (e.g. a fork,
# or a local change you haven't pushed).
name: memo

services:
  memo:
    image: ghcr.io/bugraakdemir/memo-backend:latest
    container_name: memo
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - /DATA/AppData/memo:/memo
    environment:
      - TZ=Europe/Istanbul
    # No healthcheck block here — the image already declares one
    # (Dockerfile's HEALTHCHECK), inherited automatically.

x-casaos:
  # Still amd64-only here even though build-docker.yml already publishes a
  # working arm64 image (ghcr.io/bugraakdemir/memo-backend:latest is in fact
  # already a multi-arch manifest covering both). Deliberately not adding
  # arm64 to this list until it's actually been verified booting on real ARM
  # hardware (a Raspberry Pi) — CasaOS uses this field to decide which
  # architectures to even offer the app on, so listing one that was never
  # live-tested risks a CasaOS/ARM user installing something silently
  # broken. Flip this once that verification happens (yapacam.md Faz 1).
  architectures:
    - amd64
  main: memo
  author: BugraAkdemir
  category: Utilities
  description:
    en_us: >-
      Local-first, privacy-focused AI chat backend with long-term memory.
      This image is the REST API only (no browser UI) — connect with the
      Memo desktop app or the `memo` terminal client using the access token
      printed in this container's logs on first boot.
    tr_tr: >-
      Yerel öncelikli, gizlilik odaklı, uzun süreli hafızalı yapay zekâ
      sohbet backend'i. Bu imaj yalnızca REST API'dir (tarayıcı arayüzü
      yoktur) — konteynerin ilk açılışında loglara yazılan erişim token'ı
      ile Memo masaüstü uygulaması veya `memo` terminal istemcisiyle
      bağlanın.
  tagline:
    en_us: Your private AI memory, self-hosted.
    tr_tr: Kendi sunucunda, gizli yapay zekâ hafızası.
  title:
    en_us: Memo (backend)
    tr_tr: Memo (backend)
  port_map: "8090"
  index: /api/status
  scheme: http
