    <circle cx="1010" cy="130" r="9" fill-opacity="0.9"/>
    <circle cx="1100" cy="90" r="6" fill-opacity="0.55"/>
    <circle cx="1180" cy="165" r="11"/>
    <circle cx="1090" cy="230" r="7" fill-opacity="0.7"/>
    <circle cx="1005" cy="215" r="6" fill-opacity="0.55"/>
    <circle cx="930" cy="270" r="5" fill-opacity="0.4"/>
    <circle cx="1235" cy="110" r="5" fill-opacity="0.4"/>
  </g>
  <circle cx="1180" cy="165" r="22" fill="none" stroke="#E9D3A5" stroke-opacity="0.45" stroke-width="1.5"/>

