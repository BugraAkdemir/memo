<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Memo: hatırlayan ve harekete geçen yerel yapay zekâ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1916"/>
      <stop offset="1" stop-color="#2b2620"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#B08D57" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#B08D57" stop-opacity="0"/>
