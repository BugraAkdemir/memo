      <rect x="264" y="228" width="120" height="38" rx="19" fill="#B08D57" fill-opacity="0.16" stroke="#B08D57" stroke-opacity="0.5"/>
      <text x="324" y="252" text-anchor="middle">Hatırlar</text>
      <rect x="396" y="228" width="108" height="38" rx="19" fill="#B08D57" fill-opacity="0.16" stroke="#B08D57" stroke-opacity="0.5"/>
      <text x="450" y="252" text-anchor="middle">Eyler</text>
      <rect x="516" y="228" width="156" height="38" rx="19" fill="#B08D57" fill-opacity="0.16" stroke="#B08D57" stroke-opacity="0.5"/>
