  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="23.25" fill="none" stroke="#B08D57" stroke-opacity="0.38" stroke-width="1.5"/>

  <!-- memory network motif -->
  <g stroke="#B08D57" stroke-opacity="0.35" stroke-width="1.4" fill="none">
    <path d="M930 70 L1010 130 L1100 90 L1180 165 L1090 230 L1005 215 L930 270"/>
    <path d="M1010 130 L1005 215"/>
    <path d="M1100 90 L1090 230"/>
    <path d="M930 70 L1005 215"/>
    <path d="M1180 165 L1235 110"/>
  </g>
  <g fill="#B08D57">
