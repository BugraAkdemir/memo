name: memo_flutter
description: "Memo — AI Memory Shell (Flutter Desktop)"
publish_to: 'none'
version: 2.5.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & Networking
  dio: ^5.4.0
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Markdown rendering (community-maintained continuation of the
  # Google-discontinued flutter_markdown, API-compatible drop-in)
  flutter_markdown_plus: ^1.0.12
  
  # URL launcher (for sync auth)
  url_launcher: ^6.2.4
  
  # File picker
  file_picker: ^6.1.1
  
  # Shared preferences (for local settings like lang, setup_complete)
  shared_preferences: ^2.2.2
  
  # Google Fonts
  google_fonts: ^6.1.0

  # QR code rendering (WhatsApp pairing)
  qr_flutter: ^4.1.0

  # SVG rendering (provider logos)
  flutter_svg: ^2.0.10+1

  # Audio recording (voice keyboard). Bumped 5.2.1 -> 6.2.1 for Voice Live
  # Mode (Faz 1.6): the `vad` package below requires record ^6.1.2, which
  # is incompatible with 5.x's ^5.2.1 constraint. Checked record's own
  # CHANGELOG before bumping: 6.0.0's changes are internal (broadcast
  # streams, Linux backend swapped fmedia -> parecord/ffmpeg) with no
  # breaking changes to the AudioRecorder/hasPermission/start/stop API
  # recording_provider.dart actually uses.
  record: ^6.2.1

  # Voice activity detection (Voice Live Mode Faz 1.6) — Silero VAD via
  # FFI/ONNX Runtime, covers linux/macos/windows/android/ios/web. Already
  # depends on `record` internally for capture, so no separate audio
  # capture layer is needed. See docs/plans/PLAN_voice_live_mode_faz1.md's
  # 1.5 for why this package was picked over alternatives.
  vad: ^0.0.8

  # Charts (Settings usage-stats tab)
  fl_chart: ^0.68.0

  path: any
# jni 1.0.1+ dropped the (void**) cast in attach_thread() (dartjni.h),
# which clang>=16 rejects as a hard error (incompatible-pointer-types);
# 1.0.3 entered the lockfile collaterally via pub get and broke every
# desktop build. Pin the last compiling version until upstream fixes it.
dependency_overrides:
  jni: 1.0.0
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/icon/
    - lib/icon/slash/
    - assets/vad/silero_vad_legacy.onnx
