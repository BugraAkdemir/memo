name: memo_flutter
description: "Memo — AI Memory Shell (Flutter Desktop)"
publish_to: 'none'
version: 2.5.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & Networking
  dio: ^5.4.0
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Markdown rendering
  flutter_markdown: ^0.6.22
  
  # URL launcher (for sync auth)
  url_launcher: ^6.2.4
  
  # File picker
  file_picker: ^6.1.1
  
  # Shared preferences (for local settings like lang, setup_complete)
  shared_preferences: ^2.2.2
  
  # Google Fonts
  google_fonts: ^6.1.0

  # QR code rendering (WhatsApp pairing)
  qr_flutter: ^4.1.0

  # SVG rendering (provider logos)
  flutter_svg: ^2.0.10+1

  # Audio recording (voice keyboard)
  record: ^5.2.1

  path: any
dependency_overrides:
  record_linux: ^1.0.0
  jni: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/icon/
    - lib/icon/slash/
