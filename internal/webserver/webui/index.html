<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen" class="screen hidden">
  <div class="login-box">
    <h1>Memo</h1>
    <p>This backend is on a LAN/remote network — enter its access token to continue. You'll find it in the desktop app under Settings → Remote Access, or in the container logs.</p>
    <input id="token-input" type="password" placeholder="Access token" autocomplete="off">
    <button id="token-submit">Connect</button>
    <p id="login-error" class="error hidden"></p>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">Memo</div>
    <nav>
      <button class="tab active" data-tab="chat">Chat</button>
      <button class="tab" data-tab="settings">Settings</button>
    </nav>
    <div id="status-dot" class="status-dot" title="Backend status"></div>
  </header>

  <main>
    <section id="chat-view" class="view active">
      <div id="messages" class="messages"></div>
      <form id="chat-form" class="chat-input">
        <textarea id="chat-text" placeholder="Message Memo…" rows="1"></textarea>
        <button type="submit" id="chat-send">Send</button>
      </form>
    </section>

    <section id="settings-view" class="view">
      <div class="panel">
        <h2>Local Model</h2>
        <p id="model-status" class="status-line">Loading…</p>
        <select id="model-select"></select>
        <div class="actions">
          <button id="model-start">Start</button>
          <button id="model-stop" class="secondary">Stop</button>
        </div>
      </div>

      <div class="panel">
        <h2>External Providers</h2>
        <div id="provider-list" class="provider-list"></div>
        <details class="add-provider">
          <summary>Add / update a provider</summary>
          <form id="provider-form">
            <select id="p-type">
              <option value="openai">OpenAI</option>
              <option value="gemini">Gemini</option>
              <option value="claude">Claude</option>
              <option value="grok">Grok</option>
              <option value="groq">Groq</option>
              <option value="openrouter">OpenRouter</option>
              <option value="ollama">Ollama</option>
              <option value="llama.cpp">llama.cpp (remote)</option>
              <option value="custom">Custom (OpenAI-compatible)</option>
            </select>
            <input id="p-name" placeholder="Name (e.g. my-openai)" required>
            <input id="p-model" placeholder="Model (e.g. gpt-4o-mini)">
            <input id="p-apikey" type="password" placeholder="API key" autocomplete="off">
            <input id="p-baseurl" placeholder="Base URL (custom/ollama/llama.cpp only)">
            <div class="actions">
              <button type="button" id="p-test" class="secondary">Test</button>
              <button type="submit" id="p-save">Save &amp; activate</button>
            </div>
            <p id="provider-form-msg" class="status-line"></p>
          </form>
        </details>
      </div>
    </section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
